
name: Java Microservice Validation

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version
        type: string
        required: false
        default: '21'

      sonar-project-key:
        description: SonarQube project key
        type: string
        required: true

      ms-name:
        description: Microservice name
        type: string
        required: true

      sonar-organization:
        description: SonarQube Cloud organization key
        type: string
        required: true

    secrets:
      SONAR_TOKEN:
        required: true

      INFRA_REPO_TOKEN:
        required: false

jobs:
  validate:
    name: Validate Java Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ms repo
        uses: actions/checkout@v4

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: RobertoVillalon/infraestructura
          path: infra

      - name: 3. Install Java and Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          cache-dependency-path: RobertoVillalon/${{ inputs.ms-name }}/pom.xml

      - name: Validate Java and Maven
        run: |
          java -version
          mvn -version

      - name: 4. Validate Folder Structure
        working-directory: ${{ inputs.ms-name }}
        run: |
          test -f pom.xml
          test -d src/main/java
          test -d src/test/java
          echo "Project structure validated"

      - name: 5. Unit Tests
        working-directory: ms
        run: mvn -B clean test

      - name: 6. API and Integration Tests
        working-directory: ${{ inputs.ms-name }}/
        run: mvn -B verify

      - name: 7. Security and Code Quality Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: ${{ inputs.ms-name }}/
          args: >
            -Dsonar.organization=${{ inputs.sonar-organization }}
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
